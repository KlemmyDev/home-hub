<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Home Hub</title>
<style>
:root{--bg:#0b0f14;--card:#161d27;--line:#2a3544;--text:#f4f7fb;--soft:#b6c2d1;--accent:#ffcc4d;--good:#4ade80;--bad:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 22px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
button,input{font:inherit;color:inherit}
button{min-height:64px;padding:0 28px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}
button:active{transform:scale(.98)}
input{width:100%;min-height:64px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#0f151d;user-select:text}
input:focus{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
#clock{font-size:72px;font-weight:700;line-height:1;letter-spacing:-1px}
#date{font-size:26px;color:var(--soft)}
#hello{font-size:32px;font-weight:600;text-align:right}
main{padding:0 32px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}
a.tile{display:flex;text-decoration:none;color:inherit;border:2px solid var(--line);background:var(--card);cursor:pointer}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;padding:28px;text-align:left;border-radius:24px}
a.tile:active{transform:scale(.98)}
.tile h2{margin:0;font-size:40px}
.tile p{margin:6px 0 0;color:var(--soft)}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:10px;background:var(--line)}
.up .dot{background:var(--good)}.down .dot{background:var(--bad)}
.state{font-size:24px}
.fab{position:fixed;right:24px;bottom:24px;width:72px;padding:0;font-size:32px;border-radius:50%;min-height:72px}
.page{max-width:820px;margin:0 auto;padding:40px 32px}
.page h1{font-size:48px;margin:0 0 8px}
.page p.lead{color:var(--soft);margin:0 0 28px}
.pick{border:2px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;background:var(--card)}
.pick.on{border-color:var(--accent)}
.pick label{display:flex;gap:16px;align-items:center;cursor:pointer}
.pick input[type=checkbox]{width:36px;height:36px;min-height:0;accent-color:var(--accent)}
.pick .url{margin-top:16px}
.pick small{color:var(--soft);display:block}
.row{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
.err{color:var(--bad);margin-top:16px;min-height:1.4em}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;margin-bottom:20px}
.box h3{margin:0 0 8px;font-size:30px}
.box p{margin:4px 0;color:var(--soft)}
</style>
</head>
<body>

<div id="setup" class="page hidden"></div>

<div id="dash" class="hidden">
  <header>
    <div><div id="clock"></div><div id="date"></div></div>
    <div id="hello"></div>
  </header>
  <main><div id="grid" class="grid"></div></main>
  <button class="fab" id="gear" aria-label="Settings">&#9881;</button>
</div>

<div id="settings" class="page hidden"></div>


<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null;            // { version, config, catalog }
let pollTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || "Something went wrong.");
  return r.status === 204 ? null : r.json();
}
function show(which) {
  for (const id of ["setup", "dash", "settings"]) $(id).classList.toggle("hidden", id !== which);
  if (which !== "dash") clearInterval(pollTimer);
}

/* ---------- Clock (updates once a minute) ---------- */
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  $("date").textContent = d.toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"});
  setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()));
}

/* ---------- Keep the screen on ---------- */
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (_) {}
}
document.addEventListener("visibilitychange", keepAwake);

/* ---------- Dashboard ---------- */
function drawDash() {
  const c = S.config;
  $("hello").textContent = c.name;
  const g = $("grid");
  if (!c.widgets.length) {
    g.innerHTML = '<div class="box"><h3>Nothing here yet</h3><p>Tap the cog to add your first widget.</p></div>';
    return;
  }
  g.innerHTML = c.widgets.map(w => {
    const meta = S.catalog.find(x => x.id === w.id);
    return `<a class="tile" href="${esc(w.url)}"><div><h2>${esc(meta.name)}</h2><p>${esc(meta.about)}</p></div><div class="state" data-state="${esc(w.id)}"><span class="dot"></span>Checking…</div></a>`;
  }).join("");
}
async function poll() {
  try {
    const up = await api("/api/status");
    for (const el of document.querySelectorAll("[data-state]")) {
      const ok = up[el.dataset.state];
      el.className = "state " + (ok ? "up" : "down");
      el.innerHTML = `<span class="dot"></span>${ok ? "Ready" : "Can't reach it"}`;
    }
  } catch (_) {}
}
function showDash() {
  show("dash");
  drawDash();
  poll();
  pollTimer = setInterval(poll, 30000);
}
$("gear").onclick = showSettings;

/* ---------- Setup (first run, and "change widgets") ---------- */
function drawSetup(el, first) {
  const c = S.config;
  const have = Object.fromEntries(c.widgets.map(w => [w.id, w.url]));
  el.innerHTML = `
    <h1>${first ? "Welcome to your Home Hub" : "Change your hub"}</h1>
    <p class="lead">${first ? "Let's set it up. It only takes a minute." : "Add or remove widgets, or rename your home."}</p>
    <p><strong>What's your home called?</strong></p>
    <input id="s-name" maxlength="40" placeholder="The Smith family" value="${esc(c.name)}" autocomplete="off">
    <p style="margin-top:32px"><strong>Which apps should it show?</strong></p>
    ${S.catalog.map(m => `
      <div class="pick ${have[m.id] !== undefined ? "on" : ""}" data-id="${esc(m.id)}">
        <label><input type="checkbox" ${have[m.id] !== undefined ? "checked" : ""}>
          <span><strong>${esc(m.name)}</strong><small>${esc(m.about)}</small></span></label>
        <div class="url ${have[m.id] !== undefined ? "" : "hidden"}">
          <small style="margin-bottom:8px">Where does it live on your network?</small>
          <input type="url" inputmode="url" placeholder="http://192.168.1.20:8080" value="${esc(have[m.id] || "")}" autocomplete="off" autocapitalize="off">
        </div>
      </div>`).join("")}
    <div class="err" id="s-err" role="alert"></div>
    <div class="row">
      <button class="primary" id="s-save">${first ? "Finish setup" : "Save"}</button>
      ${first ? "" : '<button id="s-cancel">Cancel</button>'}
    </div>`;
  el.querySelectorAll(".pick").forEach(p => {
    p.querySelector("input[type=checkbox]").onchange = e => {
      p.classList.toggle("on", e.target.checked);
      p.querySelector(".url").classList.toggle("hidden", !e.target.checked);
    };
  });
  const cancel = $("s-cancel"); if (cancel) cancel.onclick = showSettings;
  $("s-save").onclick = async () => {
    const widgets = [...el.querySelectorAll(".pick")]
      .filter(p => p.querySelector("input[type=checkbox]").checked)
      .map(p => ({id: p.dataset.id, url: p.querySelector("input[type=url]").value.trim()}));
    try {
      await api("/api/setup", {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({name: $("s-name").value, widgets})});
      S = await api("/api/state");
      showDash();
    } catch (e) { $("s-err").textContent = e.message; }
  };
}

/* ---------- Settings + updates ---------- */
async function showSettings() {
  show("settings");
  const el = $("settings");
  el.innerHTML = `<h1>Settings</h1>
    <div class="box"><h3>Updates</h3><div id="upd"><p>Checking…</p></div></div>
    <div class="row"><button id="chg">Change widgets</button><button class="primary" id="done">Done</button></div>`;
  $("done").onclick = showDash;
  $("chg").onclick = () => { show("setup"); drawSetup($("setup"), false); };
  await drawUpdate(true);
}
async function drawUpdate(fresh) {
  const box = $("upd");
  if (!box) return;
  let u;
  try { u = await api("/api/update" + (fresh ? "?fresh=1" : "")); } catch (_) { box.innerHTML = "<p>Couldn't check for updates.</p>"; return; }
  const st = u.status, up = u.updater;
  const alive = up && (Date.now() / 1000 - up.seen_at) < 180;
  let html = `<p>Version ${esc(u.version)}${u.current ? " (" + esc(u.current) + ")" : ""}</p>`;
  if (u.requested || (st && st.state === "running")) {
    html += `<p><strong>Updating now… the hub will restart in a few minutes.</strong></p>`;
  } else if (!u.latest) {
    html += `<p>Couldn't reach GitHub to look for a newer version.</p>`;
  } else if (u.available) {
    html += `<p><strong>A new version is ready.</strong></p>`;
    if (!alive) html += `<p>The updater isn't running on this machine, so run <code>bash install.sh</code> there.</p>`;
    else if (up && !up.can_update) html += `<p>${esc(up.why || "It can't update right now.")}</p>`;
    else html += `<div class="row"><button class="primary" id="go">Update now</button></div>`;
  } else {
    html += `<p>You're up to date.</p>`;
  }
  if (st && st.state === "failed") html += `<p style="color:var(--bad)">The last update didn't work: ${esc(st.message || "see data/update/update.log")}</p>`;
  html += `<div class="row"><button id="chk">Check again</button></div>`;
  box.innerHTML = html;
  $("chk").onclick = () => drawUpdate(true);
  const go = $("go");
  if (go) go.onclick = async () => {
    go.disabled = true;
    try { await api("/api/update/request", {method: "POST"}); } catch (_) {}
    watchUpdate();
  };
}
/* After asking, wait for the hub to restart on the new version, then reload to pick up the new screen. */
function watchUpdate() {
  const t = setInterval(async () => {
    try {
      const u = await api("/api/update");
      if (u.status && u.status.state === "done" && !u.requested) { clearInterval(t); location.reload(); }
      else if (u.status && u.status.state === "failed") { clearInterval(t); drawUpdate(false); }
      else drawUpdate(false);
    } catch (_) { /* restarting */ }
  }, 5000);
}

/* ---------- Start ---------- */
(async function start() {
  tick();
  keepAwake();
  try { S = await api("/api/state"); }
  catch (_) { document.body.innerHTML = '<div class="page"><h1>Can\'t reach the hub</h1><p class="lead">Check that it\'s running, then reload.</p></div>'; return; }
  if (!S.config.setup_done) { show("setup"); drawSetup($("setup"), true); }
  else showDash();
})();
</script>
</body>
</html>
