<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>Home Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Comfortaa:wght@700&family=Figtree:wght@600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--line:#dde1e7;--text:#101828;--soft:#5a6478;--accent:#101828;--on-accent:#fff;--good:#14a06c;--bad:#c2331f;--amber:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:500 22px/1.4 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{min-height:64px;padding:0 28px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
button:active{transform:scale(.98)}
input{width:100%;min-height:64px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;user-select:text}
input:focus{outline:3px solid #1d4ed8;outline-offset:2px}
.hidden{display:none!important}
/* setup, settings and update pages */
.page{max-width:820px;margin:0 auto;padding:40px 32px}
.page h1{font-size:48px;margin:0 0 8px;letter-spacing:-.03em}
.page p.lead{color:var(--soft);margin:0 0 28px}
.pick{border:1.5px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;background:var(--card)}
.pick.on{border-color:var(--accent)}
.pick label{display:flex;gap:16px;align-items:center;cursor:pointer}
.pick input[type=checkbox]{width:36px;height:36px;min-height:0;accent-color:var(--accent)}
.pick .url{margin-top:16px}
.pick small{color:var(--soft);display:block}
.row{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
.err{color:var(--bad);margin-top:16px;min-height:1.4em}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px;margin-bottom:20px}
.box h3{margin:0 0 8px;font-size:30px}
.box p{margin:4px 0;color:var(--soft)}

/* the dashboard: a fixed 800 x 1280 portrait stage, scaled to fit the screen */
#dash{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:var(--W,800px);height:var(--H,1280px);transform:translate(-50%,-50%) scale(var(--s,1));color:var(--text)}
#stage a{color:inherit;text-decoration:none}
.fx{display:flex;align-items:center}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#6b7488}
.tile-card{background:#fff;border-radius:30px;box-shadow:0 1px 2px rgba(20,32,70,.05),0 10px 28px rgba(20,32,70,.06)}
.gear{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e1e6ef;color:#5a6478}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;min-height:44px}
.sg{height:36px;min-height:0;padding:0 15px;display:inline-flex;align-items:center;border:0;border-radius:999px;background:none;font-size:15px;font-weight:650;color:#5a6478}
.sg.on{background:#fff;color:#101828;box-shadow:0 1px 3px rgba(20,32,70,.14)}
.tl{display:grid;grid-template-columns:92px 28px 1fr auto;align-items:center;min-height:72px;padding:4px 0}
.tl .t{font-size:21px;font-weight:600;color:#6b7488;letter-spacing:-.02em}
.tl .n{font-size:27px;font-weight:650;letter-spacing:-.025em;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:12px}
.tl .dotm{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px #fff;position:relative;z-index:1}
.pp{display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:600;color:#3a4358}
.pp i{width:10px;height:10px;border-radius:50%}
.pane{position:relative;overflow:hidden;border-radius:24px;padding:16px;display:flex;flex-direction:column}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.stat .sd{width:8px;height:8px;border-radius:50%;background:#9a9a9a}
.stat[data-up="1"] .sd{background:#3ee08f}.stat[data-up="0"] .sd{background:#ff8a80}
.toast{position:absolute;left:50%;bottom:calc(120px + var(--sb, 0px));transform:translateX(-50%);background:#101828;color:#fff;border-radius:999px;padding:14px 26px;font-size:19px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:12;white-space:nowrap}
.toast.on{opacity:1}
.cnav{width:52px;height:52px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e1e6ef;color:#101828}
.cbtn{display:inline-flex;align-items:center;gap:6px;height:52px;min-height:0;padding:0 20px;border-radius:999px;background:#101828;color:#fff;border:0;font-size:17px;font-weight:650}
.ov{position:absolute;inset:0;padding:48px 44px 124px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;scrollbar-width:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.ov.away{opacity:0;transform:scale(.97);pointer-events:none}
#calcard,#menucard,#shopcard,#chorecard{position:absolute;display:none;overflow:hidden;z-index:3}
#calcard.show,#menucard.show,#shopcard.show,#chorecard.show{display:block}
#calcard.anim,#menucard.anim,#shopcard.anim,#chorecard.anim{transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1)}
#calin,#menuin,#shopin,#chorein{position:absolute;left:0;top:0;width:760px;height:1240px;transition:opacity .3s ease}
.sg.big{height:40px;font-size:16px;padding:0 17px}
.evb{position:absolute;box-sizing:border-box;min-height:0;border:0;border-radius:10px;overflow:hidden;text-align:left;color:#101828;display:block;font-family:inherit}
.mcell{box-sizing:border-box;min-height:0;min-width:0;padding:4px;border:0;border-top:1px solid #edf0f5;border-radius:0;background:none;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;overflow:hidden;color:#101828}
.mchip{display:block;height:24px;padding:0 6px;border-radius:7px;font-size:13px;font-weight:650;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:52px;min-height:0;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:650;color:#3a4358;display:inline-flex;align-items:center;gap:8px;flex:none}
.pill.on{background:#101828;color:#fff;border-color:#101828}
button.danger{background:#c2331f;color:#fff;border-color:#c2331f;font-weight:700}
button.danger-o{color:#c2331f;border-color:#e8b9b2}
.sw2{width:84px;height:48px;min-height:0;padding:0;border-radius:999px;border:0;background:#cdd3de;position:relative;transition:background .2s}
.sw2 i{position:absolute;left:4px;top:4px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw2.on{background:#101828}.sw2.on i{transform:translateX(36px)}
#scrim{position:absolute;inset:0;z-index:5;min-height:0;padding:0;border:0;border-radius:0;background:rgba(16,24,40,.28)}
#dock{position:absolute;left:28px;bottom:calc(28px + var(--sb, 0px));width:76px;height:76px;border-radius:38px;background:#101828;box-shadow:0 14px 34px rgba(16,24,40,.38);overflow:hidden;z-index:6;transition:left .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
#dock.open{left:calc((var(--W, 800px) - var(--dw, 546px)) / 2);width:var(--dw, 546px)}
#dk-t{position:absolute;left:6px;top:6px;width:64px;height:64px;min-height:0;padding:0;border:0;border-radius:50%;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
#dk-t .i-close{display:none}#dock.open #dk-t .i-close{display:flex}#dock.open #dk-t .i-open{display:none}
#dk-i{position:absolute;left:76px;top:0;bottom:0;display:flex;align-items:center;gap:4px;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
#dock.open #dk-i{opacity:1;visibility:visible;transition:opacity .25s ease .2s}
#dock .dk{min-height:0;height:56px;width:56px;padding:0;border:0;border-radius:50%;background:none;color:#c9d0de;display:flex;align-items:center;justify-content:center;flex:none}
#dock .dk.on{width:150px;border-radius:999px;background:#fff;color:#101828;gap:8px;font-size:17px;font-weight:700}
#sheetscrim{position:absolute;inset:0;z-index:9;background:rgba(16,24,40,.4);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet{position:absolute;left:0;right:0;bottom:0;height:min(1140px,calc(var(--H, 1280px) - 40px));z-index:10;background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -10px 40px rgba(20,32,70,.25);display:flex;flex-direction:column;transform:translateY(103%);transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;visibility:hidden}
.shh{padding:26px 32px 8px}.shb{padding:0 32px 16px}.shf{padding:16px 32px calc(34px + var(--sb, 0px))}
/* phone: the same screens on a 430 wide stage */
#stage.phone{--tl:92px}
.phone .ov{padding:calc(16px + var(--st, 0px)) 14px calc(100px + var(--sb, 0px));gap:14px;overflow-y:auto;scrollbar-width:none}
.phone .ov::-webkit-scrollbar{display:none}
.phone .wgrid{display:flex!important;flex-direction:column;flex:none!important;min-height:0!important}
.phone #today{padding:16px 16px 12px!important}
.phone #today>.fx:first-child{flex-wrap:wrap;row-gap:8px}
.phone #greeting{font-size:40px!important}
.phone #clock{font-size:72px!important;-webkit-text-stroke:2.5px #101828!important}
.phone .tl{grid-template-columns:82px 22px 1fr auto}
.phone .tl .t{font-size:18px}
.phone .dinner{padding:14px 16px!important;gap:12px}
.phone .dn{font-size:26px!important}
.phone .legend{display:none}
.phone .gscroll .gwrap{flex:none;height:820px;min-height:0}
.phone #calin,.phone #menuin,.phone #shopin,.phone #chorein{overflow-y:auto;scrollbar-width:none}
.phone .sg.big{height:36px;padding:0 12px;font-size:15px}
.phone .cnav{width:44px;height:44px}
.phone .cbtn{height:44px;padding:0 16px!important;font-size:16px}
.phone #c-new{width:44px;padding:0!important;font-size:26px;line-height:1}
.phone #dock{left:16px;bottom:calc(16px + var(--sb, 0px))}
.phone #dock.open{left:calc((var(--W, 430px) - var(--dw, 388px)) / 2)}
.phone #dock .dk{width:48px;height:48px}
.phone #dock .dk.on{width:48px}
.phone .lb{display:none}
.phone #dk-i{gap:2px}
.phone .shh{padding:20px 18px 6px}.phone .shb{padding:0 18px 12px}.phone .shf{padding:12px 18px calc(18px + var(--sb, 0px))}
.phone #sheet button.primary{min-width:0!important}
#sheet input{min-width:0}
.phone #sheet input{font-size:18px;padding:0 12px}
@media (max-width:600px){.page{padding:24px 16px}.page h1{font-size:36px}}
.wcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;position:relative}
.wcol{min-height:0;height:250px;padding:8px 3px;border:0;border-radius:18px;background:#f6f8fb;display:flex;flex-direction:column;align-items:stretch;gap:5px;overflow:hidden;text-align:left;color:inherit}
.wcol.today{background:#e6edfb}
.wchip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;border-radius:9px;padding:4px 6px;font-size:14px;font-weight:650;line-height:1.15;color:#101828}
.wchip .tm{display:block;font-size:12px;font-weight:600;color:#3a4358}
.phone .wcols{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.phone .wcol{flex:none;width:96px;scroll-snap-align:start}
.drows{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}
.drow{flex:1 0 66px;display:flex;align-items:center;gap:14px;padding:0 18px;border:0;border-radius:22px;background:#f6f8fb;text-align:left;color:inherit;min-height:0}
.drow.today{background:#e6edfb}
.dname{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcook{display:block;font-size:16px;font-weight:600;color:#6b7488;margin-top:2px}
.dempty{font-size:20px;font-weight:600;color:#8a93a6}
.dplus{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,32,70,.14);display:flex;align-items:center;justify-content:center;flex:none;color:#101828;font-size:26px;font-weight:600}
.phone .dname{font-size:21px}.phone .drow{padding:0 12px;gap:10px;flex-basis:62px}.phone .dempty{font-size:17px}.phone .dplus{width:38px;height:38px}
.mealgrid{display:flex;flex-wrap:wrap;gap:8px}
.srow{display:flex;align-items:center;border-top:1px solid #edf0f5}
.stk{flex:1;min-width:0;min-height:62px;padding:0;border:0;border-radius:0;background:none;display:flex;align-items:center;gap:14px;text-align:left;color:inherit;font-size:24px;font-weight:600;letter-spacing:-.01em}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid #b8c0d0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.srow.done .chk{background:#14a06c;border-color:#14a06c}
.srow.done .sn{color:#8a93a6;text-decoration:line-through}
.sn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sx{width:52px;height:52px;min-height:0;padding:0;border:0;border-radius:50%;background:none;color:#8a93a6;display:flex;align-items:center;justify-content:center;flex:none}
.phone .stk{font-size:20px;min-height:56px}
.jrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid #edf0f5}
.jkid{display:flex;align-items:center;gap:7px;width:112px;flex:none;line-height:44px;font-size:17px}
.jkid i{width:12px;height:12px;border-radius:50%;background:var(--kc);flex:none}
.jkid b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jkid small{font-size:14px;font-weight:700;color:#6b7488}
.phone .jrow{flex-direction:column;align-items:stretch;gap:2px}
.phone .jkid{width:100%;line-height:30px}
.phone .jrow>.fx{min-width:0!important}
.phone .jchip{min-height:48px;font-size:17px}
.jchip{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--kc);background:#fff;font-size:17px;font-weight:650;color:#101828;max-width:100%;text-align:left}
.jchip.big{min-height:56px;font-size:20px;padding:0 18px 0 8px;gap:12px}
.jchip .jc{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--kc);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.jchip.big .jc{width:36px;height:36px}
.jchip .jt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jchip.done{background:#f3f6fb;color:#6b7488;border-color:#d5dbe6}
.jchip.done .jc{background:var(--kc);border-color:var(--kc)}
.jchip.done .jt{text-decoration:line-through}
.jchip.ok .jc{background:#14a06c;border-color:#14a06c}
.jchip.stp .jc small{font-size:11px;font-weight:800;color:var(--kc);letter-spacing:-.02em}
.jchip .jw{font-size:12px;font-weight:700;color:#8a5200;background:#fdefd3;border-radius:999px;padding:2px 8px;flex:none}
.jchip[data-locked]:not(.done){opacity:.6}
.jnote{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:17px;font-weight:600;color:#6b7488}
.jnote.ok{color:#14a06c}
.ppcard,#chorecard{position:relative;color:#fff;font-family:'Figtree','Onest',sans-serif;background:radial-gradient(ellipse 85% 45% at 28% 0%,rgba(196,182,255,.8),rgba(196,182,255,0) 72%),linear-gradient(165deg,#7a5cff 0%,#5a3be8 42%,#4326c9 100%)!important}
.ppcard{padding:18px 16px 14px;overflow:hidden}
.ppks{display:flex;flex-direction:column;gap:12px;position:relative}
.ppk{display:flex;align-items:center;gap:12px;background:#fff;color:#17133a;border-radius:22px;padding:10px 14px 10px 10px;box-shadow:0 5px 0 rgba(20,14,70,.38)}
.ppav{width:68px;height:68px;border-radius:50%;background:color-mix(in srgb,var(--kc) 22%,#fff);flex:none;overflow:hidden;position:relative}
.palf{border:0;background:transparent;pointer-events:none;display:block;width:100%;height:100%}
.ppb{flex:1;min-width:0}
.ppn{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ppc{font-size:15px;font-weight:800;color:#6b6890}
.ppbadge{background:linear-gradient(180deg,#ffe98a,#ffc21a);color:#4a3800;font-size:14px;font-weight:800;border-radius:999px;padding:5px 12px;box-shadow:0 6px 14px rgba(255,194,26,.3)}
.ppbadge.ok{background:linear-gradient(180deg,#a8f0c8,#3ee08f);color:#06391f;box-shadow:0 6px 14px rgba(62,224,143,.3)}
.ppbtn{display:inline-flex;align-items:center;gap:6px;height:44px;min-height:0;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:16px;font-weight:700}
.dtoggle{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #d5dbe6;background:#fff;font-size:15px;font-weight:650;color:#5a6478}
.dtoggle.pk{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;font-weight:700}
.ppcard .jnote,.ppk .jnote{color:#6b6890}.ppk .jnote.ok{color:#14a06c}
.kcard.pk{position:relative;background:#fff;color:#17133a;border:0;border-radius:24px;padding:16px 18px 18px;margin-bottom:62px;box-shadow:0 5px 0 rgba(20,14,70,.38)}
.kcard.pk:last-child{margin-bottom:12px}
.kpal{position:absolute;right:10px;top:-50px;width:124px;height:124px;pointer-events:none}
.kpal .palf{width:100%;height:100%}
.ptrack{height:12px;border-radius:6px;background:#e9e5fb;margin-bottom:12px;overflow:hidden}
.ptrack>div{height:100%;border-radius:6px;transition:width .3s}
.kcard.pk .jchip{box-shadow:0 3px 0 rgba(23,19,58,.14)}
.phone .ppav{width:56px;height:56px}.phone .ppn{font-size:21px}
.phone .kpal{width:96px;height:96px;top:-40px}
.phone .kcard.pk{margin-bottom:50px}
.kcard{border:1.5px solid #edf0f5;border-radius:22px;padding:14px 16px;margin-bottom:12px}
.ov::-webkit-scrollbar{display:none}
.ov>*{flex:none}
#body{flex:none!important;min-height:0!important}
.ov .wgrid{flex:none!important}
.cpane{flex-direction:row;align-items:center;gap:12px;padding:14px 16px;min-height:76px;text-decoration:none}
.sheet-on #sheetscrim{opacity:1;pointer-events:auto}
.sheet-on #sheet{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sw{width:44px;height:44px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:#101828;box-shadow:inset 0 0 0 3px #fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pal{animation:bob 5s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.tw{animation:twk 3.4s ease-in-out infinite}
@keyframes cdrift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
.cld{animation:cdrift 9s ease-in-out infinite alternate}
.cld2{animation:cdrift 12s ease-in-out infinite alternate-reverse}
@keyframes glint{0%,100%{opacity:.88}50%{opacity:1}}
.glint{animation:glint 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null;            // { version, config, catalog }
let pollTimer = null;
const DEMO = new URLSearchParams(location.search).has("demo");   // sample calendar and dinner, to see the design full

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || "Something went wrong.");
  return r.status === 204 ? null : r.json();
}

}

/* ---------- Pictures (brand art from PocketPals, kept in this one file) ---------- */
const PP_LOGO = `<svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="pc" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#ffe68a"/><stop offset=".55" stop-color="#ffc21a"/><stop offset="1" stop-color="#d48d00"/></radialGradient><linearGradient id="pt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#4c2dd8"/></linearGradient><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efeaff"/></linearGradient></defs><rect width="120" height="120" rx="27" fill="url(#pt)"/><path d="M20 22 Q21 27.5 26 28.5 Q21 29.5 20 35 Q19 29.5 14 28.5 Q19 27.5 20 22 Z" fill="#ffd84d"/><g transform="translate(2 0) scale(.9667)"><g transform="rotate(14 75 33)"><circle cx="75" cy="35" r="15" fill="#a86f00" opacity=".35"/><circle cx="75" cy="33" r="15" fill="url(#pc)"/><path d="M75 23 Q76.3 31.7 85 33 Q76.3 34.3 75 43 Q73.7 34.3 65 33 Q73.7 31.7 75 23 Z" fill="#fff"/></g><circle cx="31" cy="42" r="12.5" fill="url(#pb)" stroke="#2a1590" stroke-width="3.2"/><circle cx="89" cy="42" r="12.5" fill="url(#pb)" stroke="#2a1590" stroke-width="3.2"/><circle cx="31" cy="42" r="6" fill="#ffb3c6"/><circle cx="89" cy="42" r="6" fill="#ffb3c6"/><path d="M28 44 H92 Q101 44 101 53 V80 Q101 86.5 95 89.5 L65 103 Q60 105.3 55 103 L25 89.5 Q19 86.5 19 80 V53 Q19 44 28 44 Z" fill="url(#pb)" stroke="#2a1590" stroke-width="3.2" stroke-linejoin="round"/><path d="M24 55.5 H96" stroke="#b7a8ff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4.5 4"/><path d="M25.5 61 V79 Q25.5 83.5 29.5 85.3 L57 97.6 Q60 99 63 97.6 L90.5 85.3 Q94.5 83.5 94.5 79 V61" fill="none" stroke="#b7a8ff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4.5 4"/><ellipse cx="38.5" cy="77" rx="5.6" ry="3.4" fill="#ffb3c6"/><ellipse cx="81.5" cy="77" rx="5.6" ry="3.4" fill="#ffb3c6"/><circle cx="47" cy="69" r="4.6" fill="#1c1a33"/><circle cx="73" cy="69" r="4.6" fill="#1c1a33"/><circle cx="48.4" cy="67.4" r="1.5" fill="#fff"/><circle cx="74.4" cy="67.4" r="1.5" fill="#fff"/><path d="M54.5 76.5 Q60 82 65.5 76.5" fill="none" stroke="#1c1a33" stroke-width="3" stroke-linecap="round"/></g></svg>`;
const CHEV = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;

/* ---------- Fit the 800 x 1280 stage to the screen ---------- */
/* A tablet gets the fixed 800 x 1280 stage, scaled to fit. A phone gets a stage 430 wide (taller to match the screen),
   so type is about its real size; the screen then scrolls where it needs to. */
const DIM = {W: 800, H: 1280, s: 1, phone: false, st: 0, sb: 0};
function fit() {
  const iw = innerWidth, ih = innerHeight, stage = $("stage");
  const phone = Math.min(iw, ih) < 600;
  let W = 800, H = 1280, s = Math.min(iw / 800, ih / 1280);
  if (phone) { if (iw <= ih) { W = 430; s = iw / W; H = ih / s; } else { W = iw; H = ih; s = 1; } }
  const probe = getComputedStyle($("probe"));
  Object.assign(DIM, {W, H, s, phone, st: phone ? (parseFloat(probe.paddingTop) || 0) / s : 0, sb: phone ? (parseFloat(probe.paddingBottom) || 0) / s : 0});
  stage.classList.toggle("phone", phone);
  for (const [k, v] of [["--s", s], ["--W", W + "px"], ["--H", H + "px"], ["--st", DIM.st + "px"], ["--sb", DIM.sb + "px"]]) stage.style.setProperty(k, v);
}
addEventListener("resize", () => {
  fit();
  if (!$("dock")) return;
  drawDock();
  if (PANELS[view.page]) { setBox($(PANELS[view.page].card), fullBox()); PANELS[view.page].draw(); }
});

/* ---------- Clock, greeting and date ---------- */
function greeting(h) { return h < 12 ? "Good morning!" : h < 17 ? "Good afternoon!" : "Good evening!"; }
function tick() {
  const d = new Date();
  const g = greeting(d.getHours()), [a, b] = g.split(" ");
  const el = $("greeting");
  if (el) {
    el.innerHTML = `${a}<br>${b}`;
    el.style.fontSize = b.length > 8 ? "56px" : "66px";
    $("date").textContent = d.toLocaleDateString([], {weekday: "long"}) + " · " + d.toLocaleDateString([], {day: "numeric", month: "long"});
  }
  document.querySelectorAll(".clk").forEach(c => c.textContent = clockT(d));
  document.querySelectorAll(".cdt").forEach(c => c.textContent = d.toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"}));
  if (new Date().toDateString() !== tick.day) { tick.day = new Date().toDateString(); if (view.page === "overview") loadOverview(); }
  clearTimeout(tick.t);
  tick.t = setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()));
}

/* ---------- Keep the screen on ---------- */
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (_) {}
}
document.addEventListener("visibilitychange", keepAwake);

/* ---------- Dashboard ---------- */
function soon(msg) {
  const t = $("toast"); if (!t) return;
  t.textContent = typeof msg === "string" ? msg : "Coming soon";
  t.classList.add("on");
  clearTimeout(soon.t); soon.t = setTimeout(() => t.classList.remove("on"), 1800);
}
function bindSoon(root) { root.querySelectorAll("[data-soon]").forEach(b => b.onclick = soon); }

/* ---------- Dates ---------- */
const DAY_MS = 86400000;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7));       // weeks start on Monday
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const h24 = () => !!(S && S.config.hour24);
const timeOpts = () => ({hour: h24() ? "2-digit" : "numeric", minute: "2-digit", hourCycle: h24() ? "h23" : "h12"});
const clockT = d => d.toLocaleTimeString([], timeOpts()).replace(/\s?[ap]\.?m\.?/i, "");    // the big clock has no am or pm
const fmtT = d => d.toLocaleTimeString([], timeOpts()).replace(/\s?([ap])\.?m\.?/i, (_, x) => x.toLowerCase() + "m");
const PALETTE = ["#2f6fe0", "#e2523f", "#14a06c", "#e5487f", "#7b5cf0", "#f59e0b", "#0ea5b7"];
const CHEV_L = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;
const CHEV_R = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;

/* ---------- Events (from the hub, or sample ones with ?demo) ---------- */
let EV = {list: [], cals: {}};
const view = {page: "overview", mode: "day", date: new Date(), who: null, ovMode: "day", menuWeek: new Date(), choreDay: new Date()};
const dateOf = (s, allDay) => { if (allDay) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); } return new Date(s); };
const prep = e => ({...e, s: dateOf(e.start, e.all_day), e: dateOf(e.end, e.all_day)});
function onDay(e, day) {
  const a = startOfDay(day), b = addDays(a, 1);
  return e.s < b && (e.e > a || (+e.e === +e.s && e.s >= a));
}
const calOf = e => {
  if (e.hub) { const ps = (e.people || []).map(id => (S.people || []).find(p => p.id === id)).filter(Boolean); return {name: ps.map(p => p.name).join(" and "), color: ps.length ? ps[0].color : "#8a93a6", ok: true}; }
  return EV.cals[e.cal] || {name: "", color: "#8a93a6", ok: true};
};

function demoData(from, to) {
  const cals = {};
  [["d", "Dad", 0], ["m", "Mum", 1], ["a", "Kid one", 2], ["b", "Kid two", 3]].forEach(([id, name, i]) => cals[id] = {id, name, color: PALETTE[i], ok: true});
  const week = [   // by weekday, Monday first: [hour, minute, minutes long, title, calendar]
    [[8, 15, 45, "School run", "a"], [9, 30, 90, "Planning call", "d"], [15, 15, 45, "Dentist", "b"], [17, 15, 60, "Football training", "a"]],
    [[12, 0, 480, "Late shift", "m"], [16, 0, 60, "Swim", "b"]],
    [[15, 45, 75, "Drama club", "a"], [18, 30, 60, "Gym", "d"]],
    [[17, 30, 60, "Cubs", "a"], [18, 30, 90, "School disco", "b"]],
    [[15, 30, 60, "Sleepover", "b"], [18, 0, 120, "Movie night", "m"]],
    [[10, 0, 120, "Football match", "a"], [18, 30, 90, "Dinner out", "m"]],
    [[12, 30, 150, "Lunch at Gran's", "m"]],
  ];
  const list = [];
  for (let d = startOfDay(from); d < to; d = addDays(d, 1)) {
    for (const [h, mi, len, title, cal] of week[(d.getDay() + 6) % 7]) {
      const s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi);
      list.push({id: title + +d, title, location: "", cal, all_day: false, s, e: new Date(+s + len * 60000)});
    }
  }
  return {list, cals};
}
async function loadRange(from, to) {
  if (DEMO) { EV = demoData(from, to); return; }
  try {
    const r = await api(`/api/events?from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`);
    EV = {list: r.events.map(prep), cals: Object.fromEntries(r.calendars.map(c => [c.id, c]))};
  } catch (_) {}
}
const dotsFor = day => { const cs = []; for (const e of EV.list) if (onDay(e, day)) { const c = calOf(e).color; if (!cs.includes(c)) cs.push(c); } return cs.slice(0, 3); };
const dotHtml = cs => cs.map(c => `<i style="width:6px;height:6px;border-radius:50%;background:${esc(c)}"></i>`).join("");
const tag = e => { const c = calOf(e); return c.name ? `<span class="pp"><i style="background:${esc(c.color)}"></i>${esc(c.name)}</span>` : ""; };

/* ---------- Today card (Overview) ---------- */
let DIN = {meals: [], plan: {}};           // the family's dinners, and which is planned on which day
async function loadDinners() {
  if (DEMO) return;
  try { DIN = await api("/api/dinners"); } catch (_) {}
}
function dinnerFor(day) {
  const p = DIN.plan[ymd(day)], m = p && DIN.meals.find(x => x.id === p.meal);
  if (!m) return null;
  const cook = (S.people || []).find(x => x.id === p.cook);
  return {name: m.name, cook: cook ? cook.name : ""};
}
function drawDinner() {
  const el = $("dinner");
  if (!el) return;
  const t = dinnerFor(new Date());
  const name = DEMO ? "Spaghetti bolognese" : t ? t.name : "Nothing planned yet";
  const sub = DEMO ? "Dad cooking" : t && t.cook ? t.cook + " cooking" : "";
  el.innerHTML = `<div style="width:64px;height:64px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 2-3 4-3 7 0 2 1 3 3 3v8"/></svg></div>
    <div style="flex:1;min-width:0"><div class="cap" style="color:#9a4a1e">Dinner tonight</div><div class="dn" style="font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.08;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(name)}</div>${t || DEMO ? "" : '<div style="font-size:16px;font-weight:600;color:#9a4a1e;margin-top:3px">Tap to plan the week</div>'}</div>
    ${sub ? `<div style="text-align:right;font-size:17px;font-weight:600;color:#9a4a1e;flex:none">${esc(sub)}</div>` : ""}`;
  el.onclick = openMenu;
}
async function loadOverview() {
  const mon = weekStart(new Date());
  const today = startOfDay(new Date());
  await Promise.all([loadRange(mon, addDays(mon, 7)), loadDinners(), loadChores(today, today)]);
  drawToday(); drawDinner(); drawChoresCard();
}
/* The Overview's week view: the days side by side, each with its events stacked underneath. */
function weekRows(mon, now) {
  const max = 4;
  const cols = Array.from({length: 7}, (_, i) => {
    const day = addDays(mon, i), today = sameDay(day, now);
    const evs = EV.list.filter(e => onDay(e, day)).sort((a, b) => (b.all_day - a.all_day) || a.s - b.s);
    const chips = evs.slice(0, max).map(e => `<span class="wchip" style="background:${esc(tint(colorsOf(e)[0]))}">${e.all_day ? "" : `<span class="tm num">${esc(fmtT(e.s))}</span>`}${esc(e.title)}</span>`).join("")
      + (evs.length > max ? `<span style="font-size:14px;font-weight:700;color:#5a6478;text-align:center">+${evs.length - max} more</span>` : "");
    return `<button class="wcol${today ? " today" : ""}" data-wday="${i}" aria-label="${esc(day.toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"}))}"><span class="fx" style="flex-direction:column;gap:2px;padding-bottom:4px"><span style="font-size:12px;font-weight:700;letter-spacing:.06em;color:${today ? "#101828" : "#6b7488"}">${esc(day.toLocaleDateString([], {weekday: "short"}).toUpperCase())}</span><span class="num fx" style="width:38px;height:38px;border-radius:50%;justify-content:center;font-size:20px;font-weight:700;${today ? "background:#101828;color:#fff" : ""}">${day.getDate()}</span></span>${chips}</button>`;
  }).join("");
  return `<div class="wcols">${cols}</div>`;
}
function drawToday() {
  const el = $("today");
  if (!el) return;
  const now = new Date(), mon = weekStart(now);
  const strip = ["M", "T", "W", "T", "F", "S", "S"].map((w, i) => {
    const day = addDays(mon, i), today = sameDay(day, now);
    return `<button class="wd" data-day="${i}" style="border:0;background:none;border-radius:0" aria-label="${esc(day.toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"}))}"><span style="font-size:13px;font-weight:700;letter-spacing:.06em;color:${today ? "#101828" : "#8a93a6"}">${w}</span><span class="num fx" style="width:44px;height:44px;border-radius:50%;justify-content:center;font-size:21px;font-weight:700;${today ? "background:#101828;color:#fff" : "color:" + (i >= 5 ? "#8a93a6" : "#101828")}">${day.getDate()}</span><span class="fx" style="gap:4px;height:6px">${dotHtml(dotsFor(day))}</span></button>`;
  }).join("");
  const todays = EV.list.filter(e => onDay(e, now) && (e.all_day || e.e > now || (+e.e === +e.s && e.s >= now)));
  const shown = todays.slice(0, 3), rest = todays.slice(3);
  const hasCals = true;      // events can be added right on the hub, so the calendar is always there
  const bad = Object.values(EV.cals).find(c => !c.ok);
  const next = todays.find(e => !e.all_day && e.s > now);
  let nextTxt = "";
  if (next) { const m = Math.round((next.s - now) / 60000); nextTxt = m < 60 ? `Next in ${m} min` : `Next at ${fmtT(next.s)}`; }
  let body, later = "";
  if (shown.length) {
    body = `<div style="position:relative;margin-top:2px"><div style="position:absolute;left:var(--tl,105px);top:36px;bottom:36px;border-left:2px solid #e4e8f0"></div>` + shown.map((e, i) => {
      const c = calOf(e), first = i === 0 && !e.all_day;
      return `<div class="tl"><span class="t num" ${first ? 'style="color:#1d4ed8"' : ""}>${e.all_day ? '<span style="font-size:16px">All day</span>' : fmtT(e.s)}</span><span class="dotm" style="background:${first ? "#1d4ed8" : esc(c.color)}"></span><span class="n">${esc(e.title)}</span>${tag(e)}</div>`;
    }).join("") + `</div>`;
    later = rest.length ? `Later: ${esc(rest[0].title)}${rest[0].all_day ? "" : " " + fmtT(rest[0].s)}${rest.length > 1 ? ` and ${rest.length - 1} more` : ""}` : "That's everything for today";
  } else {
    const [h, p] = EV.list.some(e => onDay(e, now)) ? ["All done for today", "Nothing else on."] : ["Nothing on today", "Open the calendar to add something."];
    body = `<div style="padding:34px 0 30px;text-align:center"><div style="font-size:26px;font-weight:700;letter-spacing:-.02em">${h}</div><div style="font-size:18px;color:#6b7488;margin-top:6px">${p}</div></div>`;
    later = hasCals ? "" : "No calendars added";
  }
  const wk = view.ovMode === "week";
  const weekCount = EV.list.filter(e => { for (let i = 0; i < 7; i++) if (onDay(e, addDays(mon, i))) return true; return false; }).length;
  el.innerHTML = `
    <div class="fx" style="justify-content:space-between">
      <div class="fx" style="gap:12px;align-items:baseline"><span style="font-size:32px;font-weight:700;letter-spacing:-.04em">${wk ? "This week" : "Today"}</span>${nextTxt && !wk ? `<span class="fx" style="gap:7px;font-size:15px;font-weight:600;color:#1d4ed8"><span class="live" style="width:7px;height:7px;border-radius:50%;background:#1d4ed8"></span>${nextTxt}</span>` : ""}</div>
      <div class="fx" style="gap:3px;background:#f1f4f9;border-radius:999px;padding:3px"><button class="sg${wk ? "" : " on"}" data-ovmode="day">Day</button><button class="sg${wk ? " on" : ""}" data-ovmode="week">Week</button></div>
    </div>
    ${wk ? `<div style="margin-top:8px">${weekRows(mon, now)}</div>`
         : `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid #edf0f5">${strip}</div>
    ${body}`}
    <div class="fx" style="justify-content:space-between;gap:14px;border-top:1px solid #edf0f5;padding-top:12px;margin-top:2px">
      <span style="font-size:16px;font-weight:500;color:${bad ? "#b3321f" : "#6b7488"};min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${bad ? "Can't reach " + esc(bad.name) : wk ? (weekCount ? `${weekCount} on this week` : "A quiet week") : later}</span>
      <button data-open="${wk ? "week" : "day"}" class="fx" style="gap:6px;flex:none;height:44px;min-height:0;padding:0 18px;border-radius:999px;border:0;background:#101828;color:#fff;font-size:16px;font-weight:650">Open calendar${CHEV}</button>
    </div>`;
  el.querySelectorAll("[data-open]").forEach(b => b.onclick = () => b.dataset.open === "settings" ? showSettings() : openCal(b.dataset.open, new Date()));
  el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => openCal("day", addDays(mon, +b.dataset.day)));
  el.querySelectorAll("[data-wday]").forEach(b => b.onclick = () => openCal("day", addDays(mon, +b.dataset.wday)));
  const wc = el.querySelector(".wcols"), td = el.querySelector(".wcol.today");
  if (wc && td && DIM.phone) wc.scrollLeft = Math.max(0, td.offsetLeft - 8);
  el.querySelectorAll("[data-ovmode]").forEach(b => b.onclick = () => { view.ovMode = b.dataset.ovmode; drawToday(); });
}

/* ---------- Calendar page (Day, Week, Month) ---------- */
const fullBox = () => DIM.phone ? {l: 10, t: 10 + DIM.st, w: DIM.W - 20, h: DIM.H - 20 - DIM.st - DIM.sb} : {l: 20, t: 20, w: DIM.W - 40, h: DIM.H - 40};
const boxIn = el => { let l = 0, t = 0, n = el; const st = $("stage"); while (n && n !== st) { l += n.offsetLeft; t += n.offsetTop; n = n.offsetParent; } const ov = $("ov"); if (ov && ov.contains(el)) t -= ov.scrollTop; return {l, t, w: el.offsetWidth, h: el.offsetHeight}; };
const setBox = (el, b) => { el.style.left = b.l + "px"; el.style.top = b.t + "px"; el.style.width = b.w + "px"; el.style.height = b.h + "px"; };
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hmOf = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayDiff = (a, b) => Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / DAY_MS);
const tint = c => c + "2b";
const people = () => S.people || [];
const peopleOf = e => (e.people || []).map(id => people().find(p => p.id === id)).filter(Boolean);
const colorsOf = e => e.hub ? (peopleOf(e).length ? peopleOf(e).map(p => p.color) : ["#8a93a6"]) : [calOf(e).color];
const visible = e => !view.who || (e.hub && (e.people || []).includes(view.who));
const shown = () => EV.list.filter(visible);

/* Timed events on one day, side by side where they overlap. */
function laneUp(evs) {
  const out = []; let cluster = [], ends = [], clusterEnd = 0;

    if (col < 0) { col = ends.length; ends.push(0); }

}

  $("done").onclick = showDash;
  $("chg").onclick = () => { show("setup"); drawSetup($("setup"), false); };
  const paintHours = () => el.querySelectorAll("[data-h]").forEach(b => b.classList.toggle("primary", (b.dataset.h === "1") === h24()));
  paintHours();
  el.querySelectorAll("[data-h]").forEach(b => b.onclick = async () => {
    const want = b.dataset.h === "1";
    try { await api("/api/clock", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({hour24: want})}); S = await api("/api/state"); paintHours(); }
    catch (_) {}
  });
  drawPocketPals();
  drawFamily($("fam"), null);
  drawCalSettings();
  await drawUpdate(true);
}
async function drawUpdate(fresh) {
  const box = $("upd");
  if (!box) return;
  let u;
  try { u = await api("/api/update" + (fresh ? "?fresh=1" : "")); } catch (_) { box.innerHTML = "<p>Couldn't check for updates.</p>"; return; }
  const st = u.status, up = u.updater;
  const alive = up && (Date.now() / 1000 - up.seen_at) < 180;
  let html = `<p>Version ${esc(u.version)}${u.current ? " (" + esc(u.current) + ")" : ""}</p>`;
  if (u.requested || (st && st.state === "running")) {
    html += `<p><strong>Updating now… the hub will restart in a few minutes.</strong></p>`;
  } else if (!u.latest) {
    html += `<p>Couldn't reach GitHub to look for a newer version.</p>`;
  } else if (u.available) {
    html += `<p><strong>A new version is ready.</strong></p>`;
    if (!alive) html += `<p>The updater isn't running on this machine, so run <code>bash install.sh</code> there.</p>`;
    else if (up && !up.can_update) html += `<p>${esc(up.why || "It can't update right now.")}</p>`;
    else html += `<div class="row"><button class="primary" id="go">Update now</button></div>`;
  } else {
    html += `<p>You're up to date.</p>`;
  }
  if (st && st.state === "failed") html += `<p style="color:var(--bad)">The last update didn't work: ${esc(st.message || "see data/update/update.log")}</p>`;
  html += `<div class="row"><button id="chk">Check again</button></div>`;
  box.innerHTML = html;
  $("chk").onclick = () => drawUpdate(true);
  const go = $("go");
  if (go) go.onclick = async () => {
    go.disabled = true;
    try { await api("/api/update/request", {method: "POST"}); } catch (_) {}
    watchUpdate();
  };
}
/* After asking, wait for the hub to restart on the new version, then reload to pick up the new screen. */
function watchUpdate() {
  const t = setInterval(async () => {
    try {
      const u = await api("/api/update");
      if (u.status && u.status.state === "done" && !u.requested) { clearInterval(t); location.reload(); }
      else if (u.status && u.status.state === "failed") { clearInterval(t); drawUpdate(false); }
      else drawUpdate(false);
    } catch (_) { /* restarting */ }
  }, 5000);
}

/* ---------- Start ---------- */
(async function start() {
  keepAwake();
  try { S = await api("/api/state"); }
  catch (_) { document.body.innerHTML = '<div class="page"><h1>Can\'t reach the hub</h1><p class="lead">Check that it\'s running, then reload.</p></div>'; return; }
  if (!S.config.setup_done) { show("setup"); drawSetup($("setup"), true); }
  else showDash();
})();
</script>
